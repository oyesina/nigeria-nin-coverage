:root {
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #c2410c;
  --bg: #ffffff;
  --panel: #fafafa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-size: 13px;
}
#app { padding: 16px 18px 24px; }
.loading { color: var(--muted); }
.error { color: #b00020; }

.hero h1 { font-size: 21px; line-height: 1.25; margin: 0 0 6px; max-width: 980px; }
.hero .lede { margin: 0 0 12px; color: var(--ink); font-size: 14px; max-width: 980px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 4px 0 14px; }
.seg { display: inline-flex; align-items: center; gap: 0; }
.seg-label { color: var(--muted); margin-right: 8px; font-size: 12px; }
.seg button {
  font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer;
  border: 1px solid #cbd5e1; background: #fff; color: var(--ink); margin-left: -1px;
}
.seg button:first-of-type { border-radius: 4px 0 0 4px; }
.seg button:last-of-type { border-radius: 0 4px 4px 0; }
.seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.seg button:focus-visible, .bar-row:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--panel); border-radius: 6px; padding: 10px 12px; }
.kpi-label { color: var(--muted); font-size: 12px; }
.kpi-value { font-size: 24px; font-weight: 650; margin: 2px 0; }
.kpi-sub { color: var(--muted); font-size: 11px; }
.hero-kpi .kpi-value { color: var(--accent); }

.grid { display: grid; gap: 24px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.col { display: flex; flex-direction: column; gap: 18px; }
.pair { display: grid; gap: 18px; }
.pair.two { grid-template-columns: 1fr 1fr; }

.panel h2 { font-size: 15px; margin: 0 0 2px; }
.panel .sub { color: var(--muted); margin: 0 0 8px; font-size: 12px; }
.panel svg { display: block; overflow: visible; }
.panel .note { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }

svg .lbl { font-size: 11.5px; fill: var(--ink); }
svg .lbl.strong { font-weight: 650; }
svg .val { font-size: 11px; fill: var(--muted); }
svg .val.over { fill: #3f6f8f; font-style: italic; }
svg .axis { font-size: 10.5px; fill: var(--muted); }
.bar-row { cursor: pointer; }
.bar-row:hover rect:first-child { fill: #f3f4f6; }

.detail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 14px; margin: 10px 0 6px; }
.detail .k { display: block; color: var(--muted); font-size: 11px; }
.detail .v { display: block; font-size: 15px; font-weight: 600; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font: inherit; font-size: 12px; }

footer { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 11px; max-width: 1100px; }
footer p { margin: 0 0 6px; }

</style>
</head>

<script>(function () {
  'use strict';

  // Nigeria NIN Coverage — who is still missing from the National Identity Database?
  // Queries the embedded "NIN Coverage Data" datasource live through the Extensions API,
  // then computes coverage / uncaptured / target gap in the browser and renders SVG by hand.

  var root = document.getElementById('app');
  var DS_NAME = 'NIN Coverage Data';
  var SVGNS = 'http://www.w3.org/2000/svg';
  var TARGET_DATE = '2026-12-31';
  var TARGET = 0.95;
  var SOURCES = ['WorldPop 2025 (UN-scaled)', 'NPC/NBS projection'];

  var COLOR = {
    accent: '#c2410c',     // the insight
    ink: '#1f2937',
    muted: '#6b7280',
    grey: '#b8bec6',
    light: '#e5e7eb',
    over: '#7aa6c2',       // enrolment exceeds the population estimate
    good: '#2563eb'
  };

  var ui = { source: SOURCES[0], basis: 'all', sortBy: 'uncaptured', selected: null };
  var DATA = null;

  // ---------- helpers ----------
  function extractData(result) {
    return result && Array.isArray(result.data) ? result.data : [];
  }
  function el(tag, attrs, text) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'class') n.className = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    if (text != null) n.textContent = text;
    return n;
  }
  function s(tag, attrs, text) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    if (text != null) n.textContent = text;
    return n;
  }
  function num(v) {
    if (v == null || v === '') return null;
    var x = typeof v === 'number' ? v : parseFloat(String(v).replace(/,/g, ''));
    return isFinite(x) ? x : null;
  }
  function pick(row, name) {
    if (name in row) return row[name];
    var keys = Object.keys(row);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k.indexOf(name) !== -1) return row[k]; // e.g. "SUM(Total Enrolled)"
    }
    return null;
  }
  function toISO(v) {
    if (v == null) return null;
    if (typeof v === 'number') return new Date(v).toISOString().slice(0, 10);
    var str = String(v);
    var m = str.match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[0];
    var d = new Date(str);
    return isNaN(d) ? null : d.toISOString().slice(0, 10);
  }
  function days(a, b) { return (Date.parse(b) - Date.parse(a)) / 86400000; }
  function fmtM(x) {
    if (x == null || !isFinite(x)) return '–';
    var a = Math.abs(x);
    if (a >= 1e6) return (x / 1e6).toFixed(a >= 1e8 ? 0 : 1) + 'M';
    if (a >= 1e3) return Math.round(x / 1e3) + 'K';
    return String(Math.round(x));
  }
  function fmtPct(x, d) { return (x == null || !isFinite(x)) ? '–' : (x * 100).toFixed(d == null ? 0 : d) + '%'; }
  function fmtDate(iso) {
    var d = new Date(iso + 'T00:00:00Z');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
  }
  function sum(arr, f) { return arr.reduce(function (a, r) { var v = f(r); return a + (v || 0); }, 0); }

  function renderError(msg) {
    root.textContent = '';
    root.appendChild(el('p', { class: 'error' }, 'Could not load data: ' + msg));
  }

  // ---------- data ----------
  function pickDataSource(list) {
    var found = null;
    (list || []).forEach(function (ds) { if (ds && ds.name === DS_NAME) found = ds; });
    return found || ((list && list.length) ? list[0] : null);
  }

  function normalise(rows) {
    var out = rows.map(function (r) {
      return {
        date: toISO(pick(r, 'As Of')),
        state: pick(r, 'State'),
        region: pick(r, 'Region'),
        source: pick(r, 'Population Source'),
        f: num(pick(r, 'Female Enrolled')),
        m: num(pick(r, 'Male Enrolled')),
        t: num(pick(r, 'Total Enrolled')),
        popAll: num(pick(r, 'Population All Ages')),
        pop16: num(pick(r, 'Population 16 Plus'))
      };
    }).filter(function (r) { return r.date && r.state && r.t != null; });
    var dates = Array.from(new Set(out.map(function (r) { return r.date; }))).sort();
    return { rows: out, dates: dates, latest: dates[dates.length - 1] };
  }

  function popOf(r) { return ui.basis === 'all' ? r.popAll : r.pop16; }

  // Everything the views need, for the current source/basis.
  function compute() {
    var rows = DATA.rows.filter(function (r) { return r.source === ui.source; });
    var byDate = {};
    rows.forEach(function (r) { (byDate[r.date] = byDate[r.date] || []).push(r); });
    var latest = DATA.latest;
    var inCountry = function (r) { return r.state !== 'Diaspora'; };

    var states = byDate[latest].filter(inCountry).map(function (r) {
      var P = popOf(r);
      return {
        state: r.state, region: r.region, enrolled: r.t, female: r.f, male: r.m, pop: P,
        uncaptured: P - r.t, coverage: r.t / P, femaleShare: r.f / r.t
      };
    });

    var series = DATA.dates.map(function (d) {
      var g = (byDate[d] || []).filter(inCountry);
      var dia = (byDate[d] || []).filter(function (r) { return r.state === 'Diaspora'; });
      return {
        date: d, enrolled: sum(g, function (r) { return r.t; }),
        pop: sum(g, popOf), diaspora: sum(dia, function (r) { return r.t; }), n: g.length
      };
    });
    var last = series[series.length - 1];

    // Recent pace: average monthly additions over roughly the last six months of reports.
    var ref = null;
    for (var i = series.length - 1; i >= 0; i--) {
      if (days(series[i].date, latest) >= 175) { ref = series[i]; break; }
    }
    var paceMonths = ref ? days(ref.date, latest) / 30.44 : null;
    var pace = ref ? (last.enrolled - ref.enrolled) / paceMonths : null;

    // Population growth from the denominators themselves, projected to the target date.
    var yearAgo = null;
    for (var j = series.length - 1; j >= 0; j--) {
      if (days(series[j].date, latest) >= 360) { yearAgo = series[j]; break; }
    }
    var g = yearAgo ? Math.pow(last.pop / yearAgo.pop, 365.25 / days(yearAgo.date, latest)) - 1 : 0.021;
    var monthsLeft = days(latest, TARGET_DATE) / 30.44;
    var popAtTarget = last.pop * Math.pow(1 + g, days(latest, TARGET_DATE) / 365.25);
    var neededTotal = Math.max(0, TARGET * popAtTarget - last.enrolled);
    var neededPerMonth = neededTotal / monthsLeft;

    var regions = {};
    states.forEach(function (st) {
      var R = regions[st.region] = regions[st.region] || { region: st.region, enrolled: 0, pop: 0, female: 0 };
      R.enrolled += st.enrolled; R.pop += st.pop; R.female += st.female;
    });
    regions = Object.keys(regions).map(function (k) {
      var R = regions[k];
      R.coverage = R.enrolled / R.pop; R.femaleShare = R.female / R.enrolled; R.uncaptured = R.pop - R.enrolled;
      return R;
    });

    var stateSeries = function (name) {
      return DATA.dates.map(function (d) {
        var r = (byDate[d] || []).filter(function (x) { return x.state === name; })[0];
        return r ? { date: d, enrolled: r.t, pop: popOf(r) } : null;
      }).filter(Boolean);
    };

    return {
      latest: latest, states: states, series: series, last: last, pace: pace, paceFrom: ref && ref.date,
      growth: g, neededPerMonth: neededPerMonth, neededTotal: neededTotal, monthsLeft: monthsLeft,
      regions: regions, stateSeries: stateSeries,
      female: sum(states, function (x) { return x.female; }),
      over: states.filter(function (x) { return x.coverage > 1; })
    };
  }

  // ---------- views ----------
  function controls() {
    var bar = el('div', { class: 'controls' });
    function group(label, options, key) {
      var g = el('div', { class: 'seg', role: 'group', 'aria-label': label });
      g.appendChild(el('span', { class: 'seg-label' }, label));
      options.forEach(function (o) {
        var b = el('button', { type: 'button', class: ui[key] === o.value ? 'on' : '' }, o.label);
        b.setAttribute('aria-pressed', ui[key] === o.value ? 'true' : 'false');
        b.addEventListener('click', function () { ui[key] = o.value; render(); });
        g.appendChild(b);
      });
      return g;
    }
    bar.appendChild(group('Population estimate', [
      { label: 'WorldPop 2025', value: SOURCES[0] }, { label: 'NPC/NBS', value: SOURCES[1] }], 'source'));
    bar.appendChild(group('Count against', [
      { label: 'All ages', value: 'all' }, { label: 'Age 16+', value: '16' }], 'basis'));
    bar.appendChild(group('Rank states by', [
      { label: 'People uncaptured', value: 'uncaptured' }, { label: 'Coverage %', value: 'coverage' }], 'sortBy'));
    return bar;
  }

  function kpi(label, value, sub, cls) {
    var k = el('div', { class: 'kpi ' + (cls || '') });
    k.appendChild(el('div', { class: 'kpi-label' }, label));
    k.appendChild(el('div', { class: 'kpi-value' }, value));
    if (sub) k.appendChild(el('div', { class: 'kpi-sub' }, sub));
    return k;
  }

  function header(c) {
    var h = el('header', { class: 'hero' });
    var unc = c.last.pop - c.last.enrolled;
    var cov = c.last.enrolled / c.last.pop;
    var who = ui.basis === 'all' ? 'people in Nigeria' : 'Nigerians aged 16+';
    var title = unc > 0
      ? 'About ' + fmtM(unc) + ' ' + who + ' still have no NIN, ' + fmtPct(1 - cov) + ' of the estimated population'
      : 'Enrolment now exceeds the 16+ population estimate. Children and migrants are in the count';
    h.appendChild(el('h1', null, title));
    var onTrack = c.pace >= c.neededPerMonth;
    h.appendChild(el('p', { class: 'lede' },
      'Reaching the 95% target by end-2026 needs about ' + fmtM(c.neededPerMonth) + ' new enrolments a month. ' +
      'The recent pace is ' + fmtM(c.pace) + ' a month, ' + (onTrack ? 'enough to get there.' :
        'about ' + (c.neededPerMonth / c.pace).toFixed(1) + '× too slow.')));
    return h;
  }

  function kpis(c) {
    var row = el('section', { class: 'kpis' });
    var unc = c.last.pop - c.last.enrolled;
    row.appendChild(kpi('Enrolled in Nigeria', fmtM(c.last.enrolled), '+ ' + fmtM(c.last.diaspora) + ' diaspora, as of ' + fmtDate(c.latest)));
    row.appendChild(kpi('Estimated population' + (ui.basis === 'all' ? '' : ' (16+)'), fmtM(c.last.pop), ui.source));
    row.appendChild(kpi('Not yet captured', unc > 0 ? fmtM(unc) : '0', 'population − enrolled', 'hero-kpi'));
    row.appendChild(kpi('Coverage', fmtPct(c.last.enrolled / c.last.pop), 'target 95% by Dec 2026'));
    row.appendChild(kpi('Needed per month', fmtM(c.neededPerMonth), 'vs ' + fmtM(c.pace) + '/month recently'));
    return row;
  }

  function panel(title, sub) {
    var p = el('section', { class: 'panel' });
    p.appendChild(el('h2', null, title));
    if (sub) p.appendChild(el('p', { class: 'sub' }, sub));
    return p;
  }

  function stateBars(c, width) {
    var byUnc = ui.sortBy === 'uncaptured';
    var list = c.states.slice().sort(function (a, b) {
      return byUnc ? b.uncaptured - a.uncaptured : a.coverage - b.coverage;
    });
    var top = list.slice(0, 5).map(function (x) { return x.state; });
    var title = byUnc
      ? top.slice(0, 3).join(', ') + ' hold the most people without a NIN'
      : list[0].state + ', ' + list[1].state + ' and ' + list[2].state + ' have the lowest coverage';
    var p = panel(title, (byUnc ? 'Estimated people without a NIN' : 'Share of estimated population enrolled') +
      ' by state, ' + fmtDate(c.latest) + '. Click a state for detail.');

    var rowH = 17, padL = 92, padR = 70, padT = 6;
    var H = padT + list.length * rowH + 22;
    var W = Math.max(320, width);
    var svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': title });
    var maxV = byUnc ? Math.max.apply(null, list.map(function (x) { return Math.max(0, x.uncaptured); }))
      : Math.max(1.05, Math.max.apply(null, list.map(function (x) { return x.coverage; })));
    var x = function (v) { return padL + (W - padL - padR) * (v / maxV); };

    if (!byUnc) {
      [[TARGET, '95% target'], [1, '100%']].forEach(function (rl) {
        svg.appendChild(s('line', { x1: x(rl[0]), x2: x(rl[0]), y1: padT, y2: H - 20, stroke: rl[0] === 1 ? COLOR.muted : COLOR.ink, 'stroke-dasharray': '3 3', 'stroke-width': 1 }));
        svg.appendChild(s('text', { x: x(rl[0]), y: H - 6, 'text-anchor': 'middle', class: 'axis' }, rl[1]));
      });
    }
    list.forEach(function (d, i) {
      var y = padT + i * rowH;
      var over = d.coverage > 1;
      var v = byUnc ? Math.max(0, d.uncaptured) : d.coverage;
      var isTop = top.indexOf(d.state) !== -1;
      var sel = ui.selected === d.state;
      var g = s('g', { class: 'bar-row', tabindex: '0', role: 'button', 'aria-label': d.state });
      g.appendChild(s('rect', { x: 0, y: y, width: W, height: rowH, fill: sel ? '#fff7ed' : 'transparent' }));
      g.appendChild(s('text', { x: padL - 6, y: y + rowH * 0.72, 'text-anchor': 'end', class: 'lbl' + (isTop || sel ? ' strong' : '') }, d.state));
      g.appendChild(s('rect', {
        x: padL, y: y + 3, height: rowH - 6, width: Math.max(over && byUnc ? 0 : 1, x(v) - padL),
        fill: over ? COLOR.over : (isTop ? COLOR.accent : COLOR.grey)
      }));
      var label = byUnc ? (over ? 'enrolment > estimate' : fmtM(d.uncaptured)) : fmtPct(d.coverage);
      g.appendChild(s('text', { x: (over && byUnc ? padL : x(v)) + 4, y: y + rowH * 0.72, class: 'val' + (over ? ' over' : '') }, label));
      var t = s('title', null, d.state + ': ' + fmtM(d.enrolled) + ' enrolled of ~' + fmtM(d.pop) + ' (' + fmtPct(d.coverage) + ')');
      g.appendChild(t);
      var choose = function () { ui.selected = ui.selected === d.state ? null : d.state; render(); };
      g.addEventListener('click', choose);
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); } });
      svg.appendChild(g);
    });
    if (byUnc) {
      svg.appendChild(s('line', { x1: padL, x2: padL, y1: padT, y2: H - 20, stroke: COLOR.muted }));
    }
    p.appendChild(svg);
    if (c.over.length) {
      p.appendChild(el('p', { class: 'note' },
        'Blue bars: ' + c.over.map(function (x) { return x.state; }).join(', ') +
        ' have more NIN records than the population estimate. People often enrol in the commercial hub where they work rather than where they live, and population estimates are uncertain.' +
        (ui.basis === '16' ? ' On the 16+ basis this also shows that the NIN count includes children.' : '')));
    }
    return p;
  }

  function trend(c, width) {
    var name = ui.selected;
    var ser = name ? c.stateSeries(name) : c.series.map(function (d) { return { date: d.date, enrolled: d.enrolled, pop: d.pop }; });
    var last = ser[ser.length - 1];
    var gap = last.pop * TARGET - last.enrolled;
    var title = (name ? name + ': ' : 'Nationally, ') + (gap > 0
      ? fmtM(gap) + ' short of the 95% line as of ' + fmtDate(last.date)
      : 'above the 95% line as of ' + fmtDate(last.date));
    var p = panel(title, 'Cumulative NIN enrolments vs the estimated ' + (ui.basis === 'all' ? '' : '16+ ') +
      'population and the 95% target. NIMC published no reports for 2024.');

    var W = Math.max(320, width), H = 250, pl = 46, pr = 96, pt = 10, pb = 26;
    var t0 = Date.parse(ser[0].date), t1 = Date.parse(TARGET_DATE);
    var maxY = Math.max.apply(null, ser.map(function (d) { return Math.max(d.pop, d.enrolled); })) * 1.05;
    var x = function (iso) { return pl + (W - pl - pr) * (Date.parse(iso) - t0) / (t1 - t0); };
    var y = function (v) { return pt + (H - pt - pb) * (1 - v / maxY); };
    var svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': title });

    for (var k = 0; k <= 4; k++) {
      var v = maxY * k / 4;
      svg.appendChild(s('line', { x1: pl, x2: W - pr, y1: y(v), y2: y(v), stroke: COLOR.light }));
      svg.appendChild(s('text', { x: pl - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'axis' }, fmtM(v)));
    }
    ['2022', '2023', '2024', '2025', '2026'].forEach(function (yr) {
      var iso = yr + '-01-01';
      if (Date.parse(iso) < t0) return;
      svg.appendChild(s('text', { x: x(iso), y: H - 8, 'text-anchor': 'middle', class: 'axis' }, yr));
    });
    function path(acc) {
      return ser.map(function (d, i) { return (i ? 'L' : 'M') + x(d.date).toFixed(1) + ',' + y(acc(d)).toFixed(1); }).join(' ');
    }
    svg.appendChild(s('path', { d: path(function (d) { return d.pop; }), fill: 'none', stroke: COLOR.grey, 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
    svg.appendChild(s('path', { d: path(function (d) { return d.pop * TARGET; }), fill: 'none', stroke: COLOR.muted, 'stroke-width': 1.2 }));
    svg.appendChild(s('path', { d: path(function (d) { return d.enrolled; }), fill: 'none', stroke: COLOR.accent, 'stroke-width': 2.5 }));
    ser.forEach(function (d) {
      var dot = s('circle', { cx: x(d.date), cy: y(d.enrolled), r: 2.6, fill: COLOR.accent });
      dot.appendChild(s('title', null, fmtDate(d.date) + ': ' + fmtM(d.enrolled) + ' enrolled'));
      svg.appendChild(dot);
    });
    // Required path from the latest report to the target.
    var projPop = last.pop * Math.pow(1 + c.growth, days(last.date, TARGET_DATE) / 365.25);
    svg.appendChild(s('line', { x1: x(last.date), y1: y(last.pop), x2: x(TARGET_DATE), y2: y(projPop), stroke: COLOR.grey, 'stroke-dasharray': '2 4', 'stroke-width': 1.2 }));
    svg.appendChild(s('line', { x1: x(last.date), y1: y(last.pop * TARGET), x2: x(TARGET_DATE), y2: y(projPop * TARGET), stroke: COLOR.muted, 'stroke-dasharray': '2 4', 'stroke-width': 1 }));
    svg.appendChild(s('line', { x1: x(last.date), y1: y(last.enrolled), x2: x(TARGET_DATE), y2: y(projPop * TARGET), stroke: COLOR.accent, 'stroke-dasharray': '2 3', 'stroke-width': 1.5 }));
    var lx = x(TARGET_DATE) + 6;
    var yPop = y(projPop), yTgt = y(projPop * TARGET);
    if (yTgt - yPop < 14) { yPop -= 5; yTgt += 5; }
    svg.appendChild(s('text', { x: lx, y: yPop + 4, class: 'lbl', fill: COLOR.muted }, 'Population'));
    svg.appendChild(s('text', { x: lx, y: yTgt + 4, class: 'lbl', fill: COLOR.muted }, '95% target'));
    svg.appendChild(s('text', { x: x(last.date) + 6, y: y(last.enrolled) + 16, class: 'lbl strong', fill: COLOR.accent }, 'Enrolled ' + fmtM(last.enrolled)));
    svg.appendChild(s('text', { x: x(TARGET_DATE), y: H - 8, 'text-anchor': 'middle', class: 'axis strong-axis' }, 'Dec 2026'));
    svg.appendChild(s('line', { x1: x(TARGET_DATE), x2: x(TARGET_DATE), y1: pt, y2: H - pb, stroke: COLOR.light }));
    p.appendChild(svg);

    if (name) {
      var st = c.states.filter(function (x) { return x.state === name; })[0];
      var dl = el('div', { class: 'detail' });
      [['Enrolled', fmtM(st.enrolled)], ['Est. population', fmtM(st.pop)], ['Uncaptured', st.uncaptured > 0 ? fmtM(st.uncaptured) : 'none (over 100%)'],
        ['Coverage', fmtPct(st.coverage)], ['Women among enrollees', fmtPct(st.femaleShare)], ['Region', st.region]].forEach(function (kv) {
        var d = el('div'); d.appendChild(el('span', { class: 'k' }, kv[0])); d.appendChild(el('span', { class: 'v' }, kv[1])); dl.appendChild(d);
      });
      p.appendChild(dl);
      var back = el('button', { type: 'button', class: 'link' }, '← Back to national view');
      back.addEventListener('click', function () { ui.selected = null; render(); });
      p.appendChild(back);
    }
    return p;
  }

  function smallBars(title, sub, items, valFn, labelFn, refs, width, accentFn) {
    var p = panel(title, sub);
    var rowH = 24, padL = 96, padR = 54, padT = 4;
    var W = Math.max(260, width), H = padT + items.length * rowH + 18;
    var maxV = Math.max(1, Math.max.apply(null, items.map(valFn)));
    var x = function (v) { return padL + (W - padL - padR) * v / maxV; };
    var svg = s('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': title });
    (refs || []).forEach(function (r) {
      svg.appendChild(s('line', { x1: x(r[0]), x2: x(r[0]), y1: padT, y2: H - 16, stroke: COLOR.muted, 'stroke-dasharray': '3 3' }));
      svg.appendChild(s('text', { x: x(r[0]), y: H - 4, 'text-anchor': 'middle', class: 'axis' }, r[1]));
    });
    items.forEach(function (d, i) {
      var y = padT + i * rowH;
      svg.appendChild(s('text', { x: padL - 6, y: y + rowH * 0.66, 'text-anchor': 'end', class: 'lbl' }, d.region));
      svg.appendChild(s('rect', { x: padL, y: y + 5, height: rowH - 10, width: Math.max(1, x(valFn(d)) - padL), fill: accentFn(d, i) ? COLOR.accent : COLOR.grey }));
      var lx = x(valFn(d)) + 4;
      (refs || []).forEach(function (r) { var rx = x(r[0]); if (lx > rx - 30 && lx < rx + 3) lx = rx + 5; });
      svg.appendChild(s('text', { x: lx, y: y + rowH * 0.66, class: 'val' }, labelFn(d)));
    });
    p.appendChild(svg);
    return p;
  }

  function footer(c) {
    var f = el('footer');
    var dates = DATA.dates;
    f.appendChild(el('p', null,
      'Enrolment: NIMC monthly enrolment reports (nimc.gov.ng/nin/enrolment-report), ' + dates.length + ' reports from ' +
      fmtDate(dates[0]) + ' to ' + fmtDate(c.latest) + '. That is the latest report NIMC has published. Population: WorldPop v3.0 (2025, scaled to UN WPP 2024) ' +
      'or NPC/NBS 2022 state projections grown at the NPC national rate. Both are interpolated to each report date. Age 16+ = 57.2% of the population (UN/World Bank 2025), applied evenly to every state.'));
    f.appendChild(el('p', null,
      'Caveats: Nigeria has had no census since 2006, so every population figure is a model. NIN counts include legal residents and children, ' +
      'are recorded where people enrol (not always where they live), and are not reduced for deaths. Read "uncaptured" as an estimate with a wide range. ' +
      'Compare the two population sources to see how wide.'));
    return f;
  }

  function render() {
    if (!DATA) return;
    var c = compute();
    if (ui.selected && !c.states.some(function (x) { return x.state === ui.selected; })) ui.selected = null;
    var W = Math.max(340, (root.clientWidth || document.documentElement.clientWidth || 1100) - 4);
    var wide = W >= 900;
    var colW = wide ? Math.floor((W - 24) / 2) - 28 : W - 28;

    root.textContent = '';
    root.appendChild(header(c));
    root.appendChild(controls());
    root.appendChild(kpis(c));

    var grid = el('div', { class: 'grid' + (wide ? ' two' : '') });
    grid.appendChild(stateBars(c, colW));
    var right = el('div', { class: 'col' });
    right.appendChild(trend(c, colW));

    var regs = c.regions.slice().sort(function (a, b) { return a.coverage - b.coverage; });
    var pair = el('div', { class: 'pair' + (colW >= 560 ? ' two' : '') });
    var halfW = colW >= 560 ? Math.floor(colW / 2) - 12 : colW;
    pair.appendChild(smallBars(regs[0].region + ' has the lowest coverage',
      'Coverage by region', regs, function (d) { return d.coverage; }, function (d) { return fmtPct(d.coverage); },
      [[TARGET, '95%']], halfW, function (d, i) { return i === 0; }));
    var gen = c.regions.slice().sort(function (a, b) { return a.femaleShare - b.femaleShare; });
    var femTotal = c.female / c.last.enrolled;
    pair.appendChild(smallBars('Women are ' + fmtPct(femTotal) + ' of enrollees',
      'Women as a share of NIN enrolments, by region', gen, function (d) { return d.femaleShare; },
      function (d) { return fmtPct(d.femaleShare); }, [[0.5, 'parity']], halfW, function (d, i) { return i === 0; }));
    right.appendChild(pair);
    grid.appendChild(right);
    root.appendChild(grid);
    root.appendChild(footer(c));
  }

  function boot() {
    if (!window.tableau || !tableau.extensions) { renderError('Extensions API not loaded'); return; }
    if (!root) return;
    root.textContent = '';
    root.appendChild(el('p', { class: 'loading' }, 'Loading NIN enrolment data…'));
    tableau.extensions.initializeAsync().then(function () {
      return tableau.extensions.workbook.getAllDataSourcesAsync();
    }).then(function (list) {
      var ds = pickDataSource(list);
      if (!ds) throw new Error('no data source found in the workbook');
      var query = {
        fields: [
          { fieldCaption: 'As Of' }, { fieldCaption: 'State' }, { fieldCaption: 'Region' }, { fieldCaption: 'Population Source' },
          { fieldCaption: 'Female Enrolled', function: 'SUM' }, { fieldCaption: 'Male Enrolled', function: 'SUM' },
          { fieldCaption: 'Total Enrolled', function: 'SUM' }, { fieldCaption: 'Population All Ages', function: 'SUM' },
          { fieldCaption: 'Population 16 Plus', function: 'SUM' }
        ]
      };
      return ds.queryAsync(query);
    }).then(function (result) {
      var rows = extractData(result);
      if (!rows.length) throw new Error('the datasource returned no rows');
      DATA = normalise(rows);
      if (!DATA.rows.length) throw new Error('rows came back but none could be read (columns: ' + Object.keys(rows[0]).join(', ') + ')');
      render();
      var t = null;
      window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(render, 150); });
    }).catch(function (err) {
      renderError((err && (err.message || err.errorCode)) || String(err));
    });
  }

  boot();
})();
</script>
</body>
</html>
